name: Build IPA
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project CellBridge.xcodeproj -scheme CellBridge -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | tee build.log | grep -E 'error:|warning:|BUILD' || true
          test -d build/Build/Products/Release-iphoneos/CellBridge.app
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/CellBridge.app Payload/
          zip -qry CellBridge.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CellBridge-ipa
          path: ios/CellBridge.ipa
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ios/CellBridge.ipa --title "CellBridge (latest build)" \
            --notes "Unsigned IPA from ${GITHUB_SHA::7}. Sideload with AltStore/SideStore/Sideloadly." --prerelease
